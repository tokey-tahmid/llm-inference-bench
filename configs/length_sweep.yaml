# Where does the workload cross from memory-bound to compute-bound?
#
#   sbatch --array=0-5 slurm/run_sweep.sh configs/length_sweep.yaml
#
# This is the axis the P1 README has to answer on, and it is the one axis the
# other sweeps hold fixed. Decode is memory-bandwidth-bound: each step reads the
# whole weight matrix to produce one token per sequence, so at low batch the GPU
# is starved of arithmetic. Prefill is compute-bound: a long prompt is a big
# matmul. Sweeping input and output length independently separates the two.
#
# What to look for in the analysis:
#   - prefill cost should scale with input_len and dominate TTFT
#   - decode cost should scale with output_len and dominate end-to-end latency
#   - the crossover moves with concurrency, because batching converts a
#     bandwidth-bound decode into a compute-bound one
#
# Lengths are a phase axis (they change the workload, not the engine), so all 12
# length combinations measure against a single server launch per group. That is
# the whole point of the server/phase split: this sweep would otherwise cost 12x
# more model loads than it does.
#
# max_model_len 16384 to accommodate the 8192-token input point with headroom.

name: length-sweep

repetitions: 3
warmup_repetitions: 1

models:
  Qwen/Qwen2.5-7B-Instruct:
    path: /mnt/tier2/project/p201362/ttahmid/inference-work/hf_cache/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28
    revision: a09a35458c702b33eeacc393d103063234e8bc28

model: Qwen/Qwen2.5-7B-Instruct

engine:
  max_model_len: 16384
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  dtype: bfloat16
  enable_prefix_caching: false
  seed: 0

workload:
  shared_prefix_ratio: 0.0
  seed: 1234
  prompt_format: token_ids

axes:
  backend: [vllm, sglang]
  tensor_parallel_size: [1, 2, 4]

  # Two concurrency points: one where decode is bandwidth-starved (c=1) and one
  # where batching has filled the machine (c=64). The crossover should move
  # between them.
  load:
    - {mode: closed_loop, concurrency: 1,  num_requests: 24}
    - {mode: closed_loop, concurrency: 64, num_requests: 384}

  workload:
    # Long output, short input: isolates decode / memory-bound behaviour.
    - {label: in128_out512,   input_len: 128,  output_len: 512}
    - {label: in512_out512,   input_len: 512,  output_len: 512}
    # Balanced.
    - {label: in1024_out256,  input_len: 1024, output_len: 256}
    - {label: in2048_out256,  input_len: 2048, output_len: 256}
    # Long input, short output: isolates prefill / compute-bound behaviour.
    - {label: in4096_out32,   input_len: 4096, output_len: 32}
    - {label: in8192_out32,   input_len: 8192, output_len: 32}
