[project]
name = "llm-inference-bench"
version = "0.1.0"
description = "Backend-agnostic LLM inference performance characterisation harness"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "transformers>=4.44",
    "huggingface_hub>=0.24",
    "structlog>=24.1",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "matplotlib>=3.9"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
lib-run = "llm_inference_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_inference_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
